schema_version: "1.0"

# --- Section 1: Identification and attribution ---
name: Incomplete-Cross-Section Leakage Screen (Arrival-Order Susceptibility)
applied_definition: |
  For a cross-sectional signal computed on a panel in which units report on staggered dates
  within a reporting cycle, the screen measures ρ̂: the association between a unit's
  arrival order within the cycle and the value of the signal. ρ̂ is tested against a
  permutation noise floor obtained by shuffling arrival order within cycle, using 200
  permutations. A signal-cycle is flagged when

  $$|\hat\rho| > 0.10$$

  Detection power is verified with planted-truth positive controls: synthetic panels built
  with a known arrival-selection effect, used to confirm the screen recovers a planted effect
  rather than reacting only to noise. Output is a versioned results record (the
  `pit-screen-results` schema, version 1.0; see `docs/results-schema.md` in the reference
  implementation) that other tools may adopt as a common result format.
submitter_organizations:
  - Max Well Apex LLC
contact_email: maxwellapexlab@proton.me

# --- Section 2: Context and limitations ---
ai_rmf_characteristics:
  - Valid & Reliable
ai_lifecycle_stages:
  - Collect & Process Data
  - Operate & Monitor
object_of_measurement:
  - data
model_specificity: model agnostic
domain_specificity: domain specific -- Finance, Healthcare
usage_details: >-
  Applies to any cross-sectional signal computed on a panel where reporting units arrive on
  staggered dates within a cycle, including regulatory-filings panels, adverse-event-report
  panels, and point-in-time joins served from a feature store. A public audit registry
  applies the screen to six datasets: Open Source Asset Pricing (Chen and Zimmermann),
  benign with |ρ̂| <= 0.036 across 18 predictor-cycles; JKP Global Factor Data, benign
  by construction; an SEC EDGAR as-filed fundamentals panel on observed filing dates, where 7
  of 14 signals were flagged across 28 of 84 signal-cycles, with ROA clean at 0 of 6; an SEC
  Form 13F holdings panel; a Feast feature-store point-in-time join; and FDA FAERS quarterly
  extracts (2015q1 to 2024q4, 19,952 drug-quarters, 1,125 ingredients, 2,857,619 reports),
  where the serious_share signal was flagged in 31 of 31 screened quarters, mean ρ̂
  +0.1987 (max 0.3205) against a noise floor of 0.0507, while a term-concentration signal on
  the same panel was benign in 0 of 31 quarters and permutation of arrival order collapsed
  every FAERS reading to at most 0.0268.
known_failure_modes: >-
  A signal that is arrival-order-invariant by construction, such as the term-concentration
  signal in the FAERS audit (benign in 0 of 31 quarters), passes the screen even when other
  signals on the same panel are flagged, so a clean reading certifies only the tested
  signal-cycle, not the whole panel. The permutation noise floor is sensitive to cycle size;
  small reporting cycles reduce the power to detect a real arrival-selection effect, which is
  why planted-truth positive controls (synthetic panels with a known arrival-selection
  effect) are used to verify detection power rather than relying on the noise floor alone.
modality:
  - structured data

